name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12h
  workflow_dispatch:          # botão manual na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6A0DAD&color_dots=#ebedf0,#e0c3fc,#c77dff,#9d4edd,#6a0dad
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C77DFF&color_dots=#161b22,#3b0764,#5a189a,#7b2cbf,#c77dff

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
